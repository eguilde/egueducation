name: Validate application

on:
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - frontend-react/**
      - openapi/**
      - scripts/openapi/**
      - ops/**
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - frontend-react/**
      - openapi/**
      - scripts/openapi/**
      - ops/**
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    name: OpenAPI contract and router coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Regenerate the router contract
        shell: pwsh
        run: ./scripts/openapi/generate-openapi.ps1
      - name: Fail when the committed API contract is stale
        run: git diff --exit-code -- openapi/openapi.json openapi/router-operations.json backend/internal/apidocs/openapi.json
      - name: Validate OpenAPI and route coverage
        shell: pwsh
        run: ./scripts/openapi/test-openapi.ps1
      - name: Validate the OpenAPI 3.1 document structure
        run: npx --yes @redocly/cli@2.2.1 lint openapi/openapi.json --format=stylish

  backend:
    name: Backend tests and vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache-dependency-path: backend/go.sum
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Reachable vulnerability scan
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  oidc-postgres-integration:
    name: OIDC PostgreSQL integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: egueducation_integration
          POSTGRES_USER: egueducation
          POSTGRES_PASSWORD: egueducation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U egueducation -d egueducation_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://egueducation:egueducation@127.0.0.1:5432/egueducation_integration?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache-dependency-path: backend/go.sum
      - name: OIDC authorization-code, session, logout, and tenant-RLS flow
        working-directory: backend
        run: go test ./internal/auth -run '^TestOIDCPostgresIntegration$' -count=1 -timeout 90s
      - name: Tenant hostname directory and fail-closed routing
        working-directory: backend
        run: go test ./internal/tenant -run '^TestDatabaseResolverIntegration$' -count=1 -timeout 60s
      - name: Identity contract migration and Balotesti authorization bootstrap
        working-directory: backend
        run: go test ./internal/db -run '^Test(IdentityContractFoundation|OIDCTenantBindingUpgrade|Published0083Reconciliation)Integration$' -count=1 -timeout 120s
      - name: Phone proof, global identity uniqueness, OTP audit and replay contract
        working-directory: backend
        run: go test ./internal/auth -run '^TestPhoneOTPPostgresIntegration$' -count=1 -timeout 90s
      - name: Tenant grant RLS enforcement with a non-bypass PostgreSQL role
        working-directory: backend
        run: go test ./internal/db -run '^TestTenantGrantRLSIntegration$' -count=1 -timeout 120s
      - name: Tenant administrator cannot mutate a cross-tenant global identity
        working-directory: backend
        run: go test ./internal/admin -run '^TestTenantAdminCannotMutateSharedGlobalIdentityRegression$' -count=1 -timeout 120s
      - name: Phone identity reverse projection and SMS queue redaction
        working-directory: backend
        run: |
          go test ./internal/db -run '^TestPhoneIdentityReverseProjectionPostgres$' -count=1 -timeout 120s
          go test ./internal/notification -run '^TestSMSQueuePostgresPersistsOnlyRedactedBoundedMetadata$' -count=1 -timeout 120s

  oidc-browser-integration:
    name: OIDC browser login with deterministic test fixture
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: egueducation_browser
          POSTGRES_USER: egueducation
          POSTGRES_PASSWORD: egueducation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U egueducation -d egueducation_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      PORT: 8080
      DATABASE_URL: postgres://egueducation:egueducation@127.0.0.1:5432/egueducation_browser?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://egueducation:egueducation@127.0.0.1:5432/egueducation_browser?sslmode=disable
      FRONTEND_ORIGIN: http://127.0.0.1:4173
      BACKEND_URL: http://127.0.0.1:8080
      OIDC_ISSUER: http://127.0.0.1:4173/api/oidc
      OIDC_CLIENT_ID: egueducation-spa
      OIDC_AUDIENCE: egueducation-api
      CUSTOMER_NAME: EguEducation Test Fixture
      ENABLE_TEST_OTP_FIXTURE: true
      TEST_OTP_FIXTURE_CODE: "173829"
      TEST_OTP_FIXTURE_IDENTIFIER: oidc.browser.fixture@example.test
      TEST_OTP_FIXTURE_SUBJECT: oidc-browser-fixture-subject
      TEST_OTP_FIXTURE_TENANT_CODE: tenant-egueducation
      ARCHIVE_WORKER_ENABLED: false
      ENABLE_EUDI_WALLET: false
      FORCE_SECURE_COOKIES: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install React dependencies and Chromium
        working-directory: frontend-react
        run: |
          npm ci
          bash "$GITHUB_WORKSPACE/scripts/ci/install-playwright-chromium.sh"
      - name: Real browser authorization-code, OTP, callback, refresh and session flow
        working-directory: frontend-react
        run: npx playwright test --config=playwright.oidc.config.ts --workers=1
      - name: Upload failed OIDC browser trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-browser-integration-trace
          path: frontend-react/test-results
          if-no-files-found: ignore
          retention-days: 7

  react-real-stack-system-e2e:
    name: React to OIDC to PostgreSQL system proof
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: egueducation_system_e2e
          POSTGRES_USER: egueducation
          POSTGRES_PASSWORD: egueducation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U egueducation -d egueducation_system_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      PORT: 8080
      DATABASE_URL: postgres://egueducation_app:egueducation_app@127.0.0.1:5432/egueducation_system_e2e?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://egueducation:egueducation@127.0.0.1:5432/egueducation_system_e2e?sslmode=disable
      TEST_DATABASE_URL: postgres://egueducation:egueducation@127.0.0.1:5432/egueducation_system_e2e?sslmode=disable
      FRONTEND_ORIGIN: http://localhost:4173
      BACKEND_URL: http://127.0.0.1:8080
      OIDC_ISSUER: http://localhost:4173/api/oidc
      OIDC_CLIENT_ID: egueducation-spa
      OIDC_AUDIENCE: egueducation-api
      CUSTOMER_NAME: EguEducation Test Fixture
      ENABLE_TEST_OTP_FIXTURE: true
      TEST_OTP_FIXTURE_CODE: "173829"
      TEST_OTP_FIXTURE_IDENTIFIER: oidc.browser.fixture@example.test
      TEST_OTP_FIXTURE_SUBJECT: oidc-browser-fixture-subject
      TEST_OTP_FIXTURE_TENANT_CODE: tenant-egueducation
      ARCHIVE_WORKER_ENABLED: true
      ARCHIVE_WORKER_POLL_INTERVAL_SECONDS: 1
      ARCHIVE_STORAGE_ENDPOINT: http://127.0.0.1:9000
      ARCHIVE_STORAGE_REGION: us-east-1
      ARCHIVE_STORAGE_BUCKET: registratura-system-e2e
      ARCHIVE_STORAGE_ACCESS_KEY: minioadmin
      ARCHIVE_STORAGE_SECRET_KEY: minioadmin123
      ARCHIVE_STORAGE_USE_PATH_STYLE: true
      ARCHIVE_STORAGE_CREATE_BUCKET: true
      CLAMD_ADDRESS: 127.0.0.1:3310
      ENABLE_EUDI_WALLET: false
      FORCE_SECURE_COOKIES: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install PostgreSQL client, React dependencies and Chromium
        run: |
          cd frontend-react
          npm ci
          bash "$GITHUB_WORKSPACE/scripts/ci/install-playwright-chromium.sh"
          sudo apt-get install --yes postgresql-client
      - name: Provision the non-bypass application database role
        run: |
          psql "$MIGRATION_DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          create role egueducation_app login password 'egueducation_app' nosuperuser nocreatedb nocreaterole noinherit nobypassrls;
          grant connect on database egueducation_system_e2e to egueducation_app;
          grant usage on schema public to egueducation_app;
          alter default privileges for role egueducation in schema public grant select, insert, update, delete on tables to egueducation_app;
          alter default privileges for role egueducation in schema public grant usage, select on sequences to egueducation_app;
          alter default privileges for role egueducation in schema public grant execute on functions to egueducation_app;
          SQL
      - name: Start the pinned MinIO store for Registratura attachments and outbox delivery
        run: |
          docker run --detach --rm --name egueducation-registratura-system-minio --publish 127.0.0.1:9000:9000 --env MINIO_ROOT_USER=minioadmin --env MINIO_ROOT_PASSWORD=minioadmin123 minio/minio:RELEASE.2024-10-13T13-34-11Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          docker logs egueducation-registratura-system-minio
          exit 1
      - name: Exercise real browser, OIDC, RBAC, API and PostgreSQL persistence
        working-directory: frontend-react
        run: npx playwright test --config=playwright.system.config.ts --workers=1
      - name: Upload failed system proof trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-real-stack-system-e2e-trace
          path: frontend-react/test-results
          if-no-files-found: ignore
          retention-days: 7

  react-earchiva-real-pipeline-e2e:
    name: React eArhiva to PostgreSQL MinIO OCR and search proof
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: egueducation_earchiva_system
          POSTGRES_USER: egueducation
          POSTGRES_PASSWORD: egueducation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U egueducation -d egueducation_earchiva_system"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgres://egueducation:egueducation@127.0.0.1:5432/egueducation_earchiva_system?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://egueducation:egueducation@127.0.0.1:5432/egueducation_earchiva_system?sslmode=disable
      TEST_DATABASE_URL: postgres://egueducation:egueducation@127.0.0.1:5432/egueducation_earchiva_system?sslmode=disable
      ARCHIVE_STORAGE_ENDPOINT: http://127.0.0.1:9000
      ARCHIVE_STORAGE_ACCESS_KEY: minioadmin
      ARCHIVE_STORAGE_SECRET_KEY: minioadmin123
      ARCHIVE_PDF_VALIDATOR_PATH: /tmp/egueducation-pdf-validator
      ENABLE_TEST_OTP_FIXTURE: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install system dependencies, React dependencies and Chromium
        run: |
          cd frontend-react
          npm ci
          bash "$GITHUB_WORKSPACE/scripts/ci/install-playwright-chromium.sh"
          sudo apt-get install --yes postgresql-client
      - name: Build the isolated archive PDF validator used by the live server
        working-directory: backend
        run: go build -o /tmp/egueducation-pdf-validator ./cmd/archive-pdf-validator
      - name: Start the pinned MinIO archive store and wait for readiness
        run: |
          docker run --detach --rm --name egueducation-earchiva-system-minio --publish 127.0.0.1:9000:9000 --env MINIO_ROOT_USER=minioadmin --env MINIO_ROOT_PASSWORD=minioadmin123 minio/minio:RELEASE.2024-10-13T13-34-11Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          docker logs egueducation-earchiva-system-minio
          exit 1
      - name: Exercise PrimeReact upload through MinIO Azure OCR worker and tenant-isolated search
        working-directory: frontend-react
        run: npx playwright test --config=playwright.earchiva-system.config.ts --workers=1

  archive-postgres-integration:
    name: eArhiva PostgreSQL integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache-dependency-path: backend/go.sum
      - name: Exercise eArhiva migrations, nullable taxonomy and tenant isolation
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -tags=integration ./internal/earchiva -run 'TestArchive(MigrationsAndTenantIsolation|LegacyMigration|DocumentInsertAllowsEmptyTaxonomy)Integration' -count=1
      - name: Exercise Education governance, portfolio evidence and tenant isolation
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          go test -tags=integration ./internal/db -run '^(TestDirectorSchoolCatalogUpgradeIntegration|TestSchoolContentRBACHardeningIntegration|TestEducationOfficialArtifactImmutabilityIntegration|TestEducationSignedArtifactEvidenceNOBYPASSRLS|TestTenantKeyedSessionContextUpgradeIntegration)$' -count=1 -timeout 360s
          go test -tags=integration ./internal/education -run '^(TestGovernanceImmutableActorIdentityIntegration|TestIntertenantPortfolioTransferRoutingAndEvidenceContractIntegration|TestDirectorAdjunctDelegationIntegration|TestPortfolioIdentityAndScopedNaturalCodesIntegration|TestPortfolioValorificationPackagesIntegration|TestPortfolioDeclarationAcknowledgementsAreOwnerBoundAndServerIssued|TestPortfolioLegalWorkflowRequiresInstitutionProcedureDeclarationsAndLifecycleControls|TestPortfolioExportManifestIsOwnerScopedAndUsesSnapshotProvenance|TestPortfolioDocumentMutationRollsBackWhenOpisSyncFails|TestPortfolioDocumentVersionHistoryIsTenantScopedAndIncludesImmutableArchiveProvenance|TestSchoolClassesNOBYPASSRLS|TestSchoolReportsCompileAgainstMigratedSchema|TestSchoolReportExportRequiresReadAndSensitiveExportPermissions|TestSignedArtifactMutationsAreAtomic)$' -count=1 -timeout 480s
      - name: Deliver finalized Registratura documents to eArhiva idempotently
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -tags=integration ./internal/earchiva -run '^TestRegistraturaArchiveOutbox' -count=1 -timeout 180s
      - name: Exercise Workflow handlers, transitions, readiness, audit and tenant RLS
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -tags=integration ./internal/workflow -run '^TestWorkflowPostgresHandlersAndTenantContractsIntegration$' -count=1 -timeout 180s

  frontend:
    name: Frontend tests, build, and audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test -- --watch=false
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  frontend-react:
    name: React frontend contract, tests, build, and audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - name: Regenerate the typed API client
        run: npm run api:generate
      - name: Fail when the committed typed client is stale
        run: git diff --exit-code -- frontend-react/src/api/generated.ts frontend-react/src/api/runtime-validators.ts
        working-directory: .
      - name: Typecheck
        run: npm run typecheck
      - name: PrimeReact and theme-token policy
        run: npm run quality:ui
      - name: Generated API transport policy
        run: npm run quality:contracts
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  frontend-react-browser:
    name: React responsive shell browser test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/install-playwright-chromium.sh"
      - run: npm run e2e
      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-playwright-traces
          path: frontend-react/test-results
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Registratura Chromium end-to-end tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/install-playwright-chromium.sh"
      - run: npx playwright test e2e/registratura-parity.spec.ts --workers=1
      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  kubernetes:
    name: Render Kubernetes manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize ops/k8s >/dev/null
