name: Build, promote, and verify containers

on:
  workflow_run:
    workflows: ["Validate application"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  actions: read

# Promotion is serialized so every GitOps commit contains the backend and
# frontend digests from one source revision.
concurrency:
  group: egueducation-production-promotion
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: eguilde
  PUBLIC_ORIGIN: https://scoalabalotesti.eguilde.cloud
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  release-gate:
    name: Require successful main CI
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate immutable source revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[a-f0-9]{40}$ ]]

  validate-local-manifests:
    name: Validate local Kubernetes template
    needs: release-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Render Kustomize template
        run: kubectl kustomize ops/k8s >/dev/null

  build:
    name: Build ${{ matrix.image }}
    needs: release-gate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: egueducation-backend
            context: ./backend
            file: ./backend/Dockerfile
          - image: egueducation-frontend
            context: ./frontend-react
            file: ./frontend-react/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}
      - name: Build and publish immutable image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            SOURCE_REVISION=${{ env.SOURCE_SHA }}
          secrets: |
            primeui_license=${{ secrets.PRIMEUI_LICENSE }}
      - name: Store promoted manifest digest
        run: printf '%s' '${{ steps.build-image.outputs.digest }}' > image-digest.txt
      - name: Pass digest to promotion job
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.image }}
          path: image-digest.txt
          if-no-files-found: error
          retention-days: 1

  promote-gitops:
    name: Promote immutable images in GitOps
    needs: [validate-local-manifests, build]
    runs-on: ubuntu-24.04
    environment: production
    outputs:
      commit: ${{ steps.promote.outputs.commit }}
      changed: ${{ steps.promote.outputs.changed }}
    steps:
      - name: Download backend digest
        uses: actions/download-artifact@v4
        with:
          name: image-digest-egueducation-backend
          path: image-digests/backend
      - name: Download frontend digest
        uses: actions/download-artifact@v4
        with:
          name: image-digest-egueducation-frontend
          path: image-digests/frontend
      - name: Read immutable digests
        id: digests
        shell: bash
        run: |
          set -euo pipefail
          backend_digest="$(tr -d '\r\n' < image-digests/backend/image-digest.txt)"
          frontend_digest="$(tr -d '\r\n' < image-digests/frontend/image-digest.txt)"
          [[ "${backend_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "${frontend_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "backend=${backend_digest}" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend_digest}" >> "$GITHUB_OUTPUT"
      - name: Check out GitOps source of truth
        uses: actions/checkout@v4
        with:
          repository: eguilde/gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Update both Kustomize image transformations by digest
        id: promote
        working-directory: gitops
        shell: bash
        env:
          BACKEND_DIGEST: ${{ steps.digests.outputs.backend }}
          FRONTEND_DIGEST: ${{ steps.digests.outputs.frontend }}
        run: |
          set -euo pipefail

          promote_image() {
            IMAGE="$1" IMAGE_DIGEST="$2" SOURCE_IMAGE="$3" FILE="$4" ruby <<'RUBY'
              require 'yaml'

              file = ENV.fetch('FILE')
              source_image = ENV.fetch('SOURCE_IMAGE')
              target_image = ENV.fetch('IMAGE')
              digest = ENV.fetch('IMAGE_DIGEST')
              document = YAML.load_file(file, aliases: true)
              images = document['images']
              abort("#{file}: expected an images array") unless images.is_a?(Array)

              matches = images.select do |entry|
                [entry['name'], entry['newName']].compact.any? do |value|
                  value.to_s.sub(/[@:].*$/, '').split('/').last == source_image
                end
              end
              abort("#{file}: expected exactly one image transformation for #{source_image}") unless matches.length == 1

              image = matches.first
              # Keep name as the base-manifest match key. GitOps has used more
              # than one registry, so only the destination is normalized.
              image['newName'] = target_image
              image.delete('newTag')
              image['digest'] = digest

              File.write(file, YAML.dump(document).sub(/\A---\s*\n/, ''))
          RUBY
          }

          promote_image \
            'ghcr.io/eguilde/egueducation-backend' \
            "${BACKEND_DIGEST}" \
            'egueducation-backend' \
            'namespaces/education/egueducation/backend/kustomization.yaml'
          promote_image \
            'ghcr.io/eguilde/egueducation-frontend' \
            "${FRONTEND_DIGEST}" \
            'egueducation-frontend' \
            'namespaces/education/egueducation/frontend/kustomization.yaml'

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add namespaces/education/egueducation/backend/kustomization.yaml \
            namespaces/education/egueducation/frontend/kustomization.yaml
          if git diff --cached --quiet; then
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(egueducation): promote ${SOURCE_SHA} by digest"
          promotion_commit="$(git rev-parse HEAD)"
          echo "commit=${promotion_commit}" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo 'GitOps promotion failed after retries' >&2
          exit 1

  verify-public-availability:
    name: Verify public availability
    needs: promote-gitops
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Wait for backend, OIDC, and the exact React revision
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            health="$(curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 15 "${PUBLIC_ORIGIN}/health")" || true
            discovery="$(curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 15 "${PUBLIC_ORIGIN}/api/oidc/.well-known/openid-configuration")" || true
            revision="$(curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 15 "${PUBLIC_ORIGIN}/revision.json")" || true
            landing="$(curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 15 "${PUBLIC_ORIGIN}/")" || true
            oidc_ui="$(curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 15 "${PUBLIC_ORIGIN}/api/oidc/ui/login.js")" || true
            if jq -e '.status == "ok" and .database == "ok"' >/dev/null <<<"${health}" \
              && jq -e --arg issuer "${PUBLIC_ORIGIN}/api/oidc" \
                '.issuer == $issuer
                 and .authorization_endpoint == ($issuer + "/authorize")
                 and .token_endpoint == ($issuer + "/token")
                 and .revocation_endpoint == ($issuer + "/revoke")
                 and .end_session_endpoint == ($issuer + "/session/end")' >/dev/null <<<"${discovery}"; then
              if jq -e --arg revision "${SOURCE_SHA}" '.revision == $revision' >/dev/null <<<"${revision}" \
                && grep -Fq '<title>eGuEducation</title>' <<<"${landing}" \
                && grep -Fq "otpBoxes[index+1].focus()" <<<"${oidc_ui}"; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Public availability checks did not become healthy within five minutes.' >&2
          exit 1

  rollback-failed-promotion:
    name: Roll back a failed public rollout
    if: ${{ always() && needs.promote-gitops.result == 'success' && needs.promote-gitops.outputs.changed == 'true' && needs.verify-public-availability.result == 'failure' }}
    needs: [promote-gitops, verify-public-availability]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out GitOps source of truth
        uses: actions/checkout@v4
        with:
          repository: eguilde/gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Revert the failed immutable promotion
        shell: bash
        env:
          PROMOTION_COMMIT: ${{ needs.promote-gitops.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "${PROMOTION_COMMIT}" =~ ^[a-f0-9]{40}$ ]]
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git revert --no-edit "${PROMOTION_COMMIT}"
          git push origin HEAD:main
