name: Production OIDC canary

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build, promote, and verify containers"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: egueducation-production-oidc-canary
  cancel-in-progress: false

jobs:
  production-oidc-canary:
    name: Production PKCE and OTP canary
    # The protected production environment contains the three canary secrets.
    # Keep automatic execution disabled until the gated backend route is deployed.
    if: >-
      ${{
        vars.ENABLE_PRODUCTION_OIDC_CANARY == 'true' &&
        ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
         (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'workflow_run' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    env:
      PRODUCTION_ORIGIN: https://scoalabalotesti.eguilde.cloud
      PRODUCTION_E2E_CANARY_IDENTIFIER: ${{ secrets.PRODUCTION_E2E_CANARY_IDENTIFIER }}
      PRODUCTION_E2E_CANARY_OTP: ${{ secrets.PRODUCTION_E2E_CANARY_OTP }}
      PRODUCTION_E2E_CANARY_ACTIVATION_KEY: ${{ secrets.PRODUCTION_E2E_CANARY_ACTIVATION_KEY }}
    steps:
      - name: Check out the deployed source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend-react
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run production OIDC canary without artifacts
        working-directory: frontend-react
        run: npx playwright test --config=playwright.production.config.ts --workers=1
