apiVersion: v1
kind: ConfigMap
metadata:
  name: egueducation-backend-config
  namespace: education
data:
  PORT: "8080"
  APP_ENV: "production"
  FRONTEND_ORIGIN: "https://scoalabalotesti.eguilde.cloud"
  OIDC_ISSUER: "https://scoalabalotesti.eguilde.cloud/api/oidc"
  OIDC_CLIENT_ID: "egueducation-spa"
  OIDC_AUDIENCE: "egueducation-api"
  OIDC_DESKTOP_CLIENT_ID: "egueducation-desktop"
  SMS_SENDER_NAME: "EguEducation"
  ENABLE_SMS_OTP: "true"
  ENABLE_PRODUCTION_FIXED_OTP_TEST_USER: "true"
  ENABLE_PASSKEYS: "true"
  ENABLE_EUDI_WALLET: "true"
  ENABLE_GDPR_FEATURES: "true"
  ARCHIVE_WORKER_ENABLED: "true"
  ARCHIVE_WORKER_POLL_INTERVAL_SECONDS: "5"
  ARCHIVE_WORKER_MAX_ATTEMPTS: "5"
  ARCHIVE_STORAGE_CREATE_BUCKET: "false"
  AZURE_DOCUMENT_INTELLIGENCE_MODEL: "prebuilt-read"
  AZURE_DOCUMENT_INTELLIGENCE_API_VERSION: "2024-11-30"
  AZURE_DOCUMENT_INTELLIGENCE_TIMEOUT_MINUTES: "60"
