server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'" always;

  location = /revision.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Replace and retire the service worker installed by the former Angular UI.
  location = /ngsw-worker.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Angular's documented emergency deactivation path: an existing Angular
  # worker deletes its caches and unregisters itself when ngsw.json is 404.
  location = /ngsw.json {
    add_header Cache-Control "no-store" always;
    return 404;
  }

  # The SPA shell must be revalidated on every navigation. Static assets are
  # content-hashed, but caching index.html can pin a browser to a frontend that
  # no longer exists after a GitOps rollout.
  location = /index.html {
    expires -1;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://egueducation-backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location = /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
